<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doaa AL Yazji</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Doaa AL Yazji, software developer and computer engineering student from Palestine. Sanad, Mudabbir, Java engines, competitive programming.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: the whole portfolio is an original code editor. Title bar / activity bar + explorer /
   tabbed editor with breadcrumbs / terminal panel / status bar. Each "file" is a section.
   Dark "night ink" theme by default; a full light theme behind the toggle. */
:root {
  --bg: #0e1220;          /* editor */
  --panel: #121729;       /* sidebar, terminal */
  --chrome: #0a0d18;      /* title bar, activity bar, status */
  --line: #222a40;
  --line-2: #2f3854;
  --fg: #e3e7f2;
  --muted: #8089a3;
  --dim: #566079;
  --accent: #ff5c7a;      /* rose, my signature */
  --accent-2: #ff8a4c;    /* Sanad orange */
  --kw: #c792ff;          /* keywords */
  --fn: #6cc6ff;          /* functions */
  --str: #ffc66d;         /* strings */
  --num: #ff9e64;
  --type: #5ee0c8;        /* types */
  --cm: #5a6582;          /* comments */
  --ok: #7ee0a1;
  --hover: rgba(255, 255, 255, .045);
  --sel: rgba(108, 198, 255, .1);
  --shadow: 0 30px 80px -30px rgba(0, 0, 0, .8);
  --f-ui: "Geist", "Segoe UI", system-ui, sans-serif;
  --f-code: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --f-ar: "Tajawal", "Segoe UI", Tahoma, sans-serif;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #fbfbfd; --panel: #f2f3f8; --chrome: #e8eaf1; --line: #dde0ea; --line-2: #cbd0de;
  --fg: #1c2133; --muted: #5d6680; --dim: #8b93a8;
  --accent: #d92d55; --accent-2: #d8621f;
  --kw: #8a3fd1; --fn: #1667c4; --str: #a35f00; --num: #c2511a; --type: #0b8a77; --cm: #8d96ab; --ok: #17834b;
  --hover: rgba(20, 30, 60, .05); --sel: rgba(22, 103, 196, .08); --shadow: 0 30px 70px -35px rgba(30, 40, 80, .35);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 14px/1.6 var(--f-ui); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 1.5px solid var(--fn); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--accent); color: #fff; }
[lang="ar"] { font-family: var(--f-ar); letter-spacing: normal !important; }
.mono { font-family: var(--f-code); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- shell ---------- */
.app {
  height: 100%; display: grid; grid-template-rows: 40px 1fr 26px;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
}
.titlebar { display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--chrome); border-bottom: 1px solid var(--line); min-width: 0; }
.lights { display: flex; gap: 7px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.menu-btn { display: none; width: 30px; height: 30px; border-radius: 6px; place-items: center; }
.menu-btn:hover { background: var(--hover); }
.menu-btn svg { width: 18px; height: 18px; }
.search {
  margin: 0 auto; display: flex; align-items: center; gap: 8px; height: 26px; width: min(460px, 50vw); padding: 0 10px; border-radius: 7px;
  border: 1px solid var(--line-2); background: var(--hover); color: var(--muted); font-size: 12.5px; transition: border-color .2s;
}
.search:hover { border-color: var(--fn); color: var(--fg); }
.search svg { width: 14px; height: 14px; flex: none; }
.search span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 500 11px/1 var(--f-code); padding: 3px 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--muted); background: var(--panel); }
.tb-right { display: flex; gap: 4px; }
.icon-btn { width: 30px; height: 30px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); transition: background .2s, color .2s; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn svg { width: 17px; height: 17px; }

.body { display: grid; grid-template-columns: 48px 248px 1fr; min-height: 0; }
.activity { background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; }
.act { position: relative; width: 48px; height: 46px; display: grid; place-items: center; color: var(--dim); transition: color .2s; }
.act svg { width: 23px; height: 23px; }
.act:hover, .act.on { color: var(--fg); }
.act.on::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 2px; background: var(--accent); border-radius: 2px; }
.act .dot { position: absolute; top: 9px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 2px var(--chrome); }
.act-spacer { flex: 1; }

/* explorer */
.side { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.side-head { height: 36px; display: flex; align-items: center; padding: 0 16px; font: 600 11px/1 var(--f-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tree { overflow: auto; flex: 1; padding-bottom: 10px; }
.folder-row, .file {
  width: 100%; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px 0 calc(10px + var(--d, 0) * 14px);
  font-size: 13px; color: var(--fg); text-align: left; white-space: nowrap; transition: background .15s;
}
.folder-row { font-weight: 600; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.folder-row.sub { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500; color: var(--fg); }
.folder-row svg { width: 12px; height: 12px; transition: transform .2s; flex: none; }
.folder.closed > .folder-row svg { transform: rotate(-90deg); }
.folder.closed > .kids { display: none; }
.file:hover, .folder-row:hover { background: var(--hover); }
.file.on { background: var(--sel); box-shadow: inset 1px 0 0 var(--fn); }
.fi { width: 26px; flex: none; font: 700 9px/1 var(--f-code); text-align: center; color: var(--c, var(--muted)); letter-spacing: -.02em; }
.file .badge { margin-left: auto; font: 600 10px/1 var(--f-code); padding: 3px 6px; border-radius: 999px; }
.badge.live { background: rgba(126, 224, 161, .14); color: var(--ok); }
.badge.new { background: rgba(255, 138, 76, .16); color: var(--accent-2); }
.side-card { margin: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); display: flex; gap: 10px; align-items: center; }
.avatar { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; font: 800 14px/1 var(--f-code); color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.side-card b { display: block; font-size: 13px; }
.side-card small { color: var(--muted); font-size: 11.5px; }

/* editor */
.editor { display: grid; grid-template-rows: 38px 26px 1fr auto; min-width: 0; min-height: 0; }
.tabs { display: flex; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 12px; height: 38px; border-right: 1px solid var(--line);
  font-size: 13px; color: var(--muted); white-space: nowrap; cursor: pointer; animation: tabin .25s ease both; flex: none;
}
@keyframes tabin { from { opacity: 0; transform: translateY(6px); } }
.tab:hover { color: var(--fg); }
.tab.on { background: var(--bg); color: var(--fg); }
.tab.on::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
.tab .x { width: 20px; height: 20px; border-radius: 4px; display: grid; place-items: center; opacity: 0; font-size: 15px; line-height: 1; color: var(--muted); }
.tab.on .x, .tab:hover .x { opacity: 1; }
.tab .x:hover { background: var(--hover); color: var(--fg); }
.crumbs { display: flex; align-items: center; gap: 6px; padding: 0 16px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; }
.crumbs b { color: var(--fg); font-weight: 500; }
.content { overflow: auto; min-height: 0; position: relative; scroll-behavior: smooth; }
.view { animation: viewin .45s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes viewin { from { opacity: 0; transform: translateY(12px); } }

/* terminal */
.term { height: 34%; min-height: 150px; max-height: 340px; border-top: 1px solid var(--line); background: var(--panel); display: grid; grid-template-rows: 32px 1fr; }
.app.term-off .term { display: none; }
.term-head { display: flex; align-items: center; gap: 18px; padding: 0 12px 0 16px; font: 600 11px/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.term-head .on { color: var(--fg); box-shadow: inset 0 -1px 0 var(--accent); padding-block: 10px; }
.term-head .sp { flex: 1; }
.term-body { overflow: auto; padding: 6px 16px 12px; font: 13px/1.6 var(--f-code); }
.tl { white-space: pre-wrap; word-break: break-word; animation: tl .2s ease both; }
@keyframes tl { from { opacity: 0; } }
.tl a { color: var(--fn); }
.prompt { color: var(--ok); }
.prompt b { color: var(--fn); font-weight: 400; }
.tform { display: flex; gap: 8px; align-items: baseline; }
.tform input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--fg); font: inherit; caret-color: var(--accent); padding: 0; }
.c-ok { color: var(--ok); } .c-kw { color: var(--kw); } .c-fn { color: var(--fn); } .c-str { color: var(--str); } .c-cm { color: var(--cm); } .c-acc { color: var(--accent); } .c-mut { color: var(--muted); }

/* status bar */
.status { display: flex; align-items: center; gap: 2px; padding: 0 6px; font-size: 12px; color: #fff; background: linear-gradient(90deg, #d93a5c, #e5603f); white-space: nowrap; overflow: hidden; }
.status > * { display: inline-flex; align-items: center; gap: 5px; padding: 0 8px; height: 26px; }
.status button:hover { background: rgba(255, 255, 255, .14); }
.status svg { width: 13px; height: 13px; }
.status .sp { flex: 1; padding: 0; }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: #fff; animation: blink 1.6s infinite; }
@keyframes blink { 50% { opacity: .3; } }

/* ---------- code view ---------- */
.code { padding: 14px 0 60px; font: 13.5px/1.75 var(--f-code); min-width: 0; }
.cl { display: grid; grid-template-columns: 64px 1fr; padding-right: 24px; animation: cl .35s ease both; animation-delay: calc(min(var(--i), 40) * 18ms); }
@keyframes cl { from { opacity: 0; transform: translateX(-8px); } }
.cl:hover { background: var(--hover); }
.cl .n { text-align: right; padding-right: 22px; color: var(--dim); user-select: none; }
.cl:hover .n { color: var(--fg); }
.cl .t { white-space: pre-wrap; word-break: break-word; min-width: 0; }
.cl .t a { text-decoration: underline; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; }
.cl .t a:hover { text-decoration-color: currentColor; }
.k { color: var(--kw); } .f { color: var(--fn); } .s { color: var(--str); } .nm { color: var(--num); } .ty { color: var(--type); } .cm { color: var(--cm); font-style: italic; } .p { color: var(--accent); }
.caret { display: inline-block; width: .55em; height: 1.15em; background: var(--accent); vertical-align: text-bottom; animation: caret 1s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* ---------- rich views ---------- */
.doc { max-width: 1040px; margin: 0 auto; padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 48px) 80px; }
.eyebrow { font: 500 12px/1 var(--f-code); color: var(--accent); display: flex; align-items: center; gap: 8px; }
.eyebrow::before { content: "//"; color: var(--dim); }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.h1 { font: 800 clamp(30px, 5vw, 52px)/1.05 var(--f-code); letter-spacing: -.03em; margin: 12px 0 14px; }
.h1 [lang="ar"] { font-size: .6em; font-weight: 700; color: var(--muted); margin-left: 10px; }
.lead { font-size: 16px; color: var(--muted); max-width: 64ch; margin: 0; }
.lead b { color: var(--fg); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { font: 500 12px/1 var(--f-code); padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line-2); color: var(--muted); background: var(--panel); }
.chip.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); background: color-mix(in srgb, var(--ok) 10%, transparent); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; font: 600 13px/1 var(--f-ui); text-decoration: none;
  border: 1px solid var(--line-2); background: var(--panel); color: var(--fg); transition: transform .2s, border-color .2s, background .2s; white-space: nowrap;
}
.btn:hover { transform: translateY(-2px); border-color: var(--fg); }
.btn.pri { background: linear-gradient(120deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; box-shadow: 0 10px 30px -12px var(--accent); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn .k2 { font: 500 11px/1 var(--f-code); opacity: .7; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.panel { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); min-width: 0; overflow: hidden; }
.panel-h { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-bottom: 1px solid var(--line); font: 500 12px/1 var(--f-code); color: var(--muted); }
.panel-h .sp { flex: 1; }
.run { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 5px; font: 600 11.5px/1 var(--f-code); color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); transition: background .2s; }
.run:hover { background: color-mix(in srgb, var(--ok) 22%, transparent); }
.run svg { width: 11px; height: 11px; }
.panel .code { padding: 10px 0 14px; font-size: 12.5px; }
.panel .cl { grid-template-columns: 44px 1fr; }
.panel .cl .n { padding-right: 14px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.list li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; color: var(--muted); }
.list li::before { content: "›"; color: var(--accent); font: 700 15px/1.45 var(--f-code); }
.list b { color: var(--fg); font-weight: 600; }
.sec { margin-top: 36px; }
.sec-t { font: 600 12px/1 var(--f-code); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
.sec-t::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.meta { display: grid; grid-template-columns: repeat(4, 1fr); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 24px; }
.meta > div { padding: 14px 16px; border-right: 1px solid var(--line); min-width: 0; }
.meta > div:last-child { border-right: 0; }
.meta small { display: block; font: 500 11px/1 var(--f-code); color: var(--dim); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.meta b { font-weight: 600; font-size: 14px; }
@media (max-width: 700px) { .meta { grid-template-columns: 1fr 1fr; } .meta > div:nth-child(2) { border-right: 0; } .meta > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); } }

/* welcome */
.welcome { position: relative; overflow: hidden; }
.welcome::before {
  content: ""; position: absolute; inset: -40% -10% auto auto; width: 70%; aspect-ratio: 1; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%); animation: float 12s ease-in-out infinite alternate;
}
.welcome::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 44px 44px;
  -webkit-mask-image: radial-gradient(ellipse at 70% 0%, #000, transparent 70%); mask-image: radial-gradient(ellipse at 70% 0%, #000, transparent 70%);
}
@keyframes float { to { transform: translate(-12%, 18%) scale(1.15); } }
.welcome .doc { position: relative; z-index: 1; }
.hello { font: 500 14px/1 var(--f-code); color: var(--muted); }
.hello .c-ok { margin-right: 6px; }
.name { font: 800 clamp(40px, 8.4vw, 92px)/.95 var(--f-code); letter-spacing: -.05em; margin: 18px 0 6px; }
.name .ch { display: inline-block; animation: drop .7s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(var(--i) * 40ms); }
.name .al { background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--str), var(--accent)); background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: drop .7s cubic-bezier(.2, .8, .2, 1) both, shine 6s linear infinite; animation-delay: calc(var(--i) * 40ms), 0s; }
@keyframes drop { from { opacity: 0; transform: translateY(40%) rotate(8deg); } }
@keyframes shine { to { background-position: -300% 0; } }
.role { font: 500 clamp(17px, 2.4vw, 24px)/1.4 var(--f-code); margin: 0 0 22px; min-height: 1.4em; }
.role .p { margin-right: 10px; }
.role #roleText { color: var(--fn); }
.cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 30px; }
@media (max-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } }
.stat { padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 85%, transparent); backdrop-filter: blur(6px); min-width: 0; }
.stat b { display: block; font: 800 28px/1 var(--f-code); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12.5px; }
.start { display: grid; grid-template-columns: 1fr 1.25fr; gap: 28px; margin-top: 40px; }
@media (max-width: 900px) { .start { grid-template-columns: 1fr; } }
.start h3 { font: 600 15px/1 var(--f-ui); margin-bottom: 12px; }
.links { display: grid; gap: 2px; }
.links button { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px; border-radius: 6px; color: var(--fn); font-size: 13.5px; text-align: left; transition: background .15s; }
.links button:hover { background: var(--hover); }
.links svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.links kbd { margin-left: auto; }
.recent { display: grid; gap: 8px; }
.rec {
  display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); text-align: left;
  background: color-mix(in srgb, var(--panel) 80%, transparent); transition: border-color .2s, transform .2s;
}
.rec:hover { border-color: var(--accent); transform: translateX(4px); }
.rec .fi { width: 36px; height: 36px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); border: 1px solid var(--line); }
.rec b { font-weight: 600; font-size: 14px; display: block; }
.rec small { color: var(--muted); font-size: 12px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rec > span { min-width: 0; }
.rec time { font: 500 11.5px/1 var(--f-code); color: var(--dim); }
.tip { margin-top: 30px; font: 13px/1.6 var(--f-code); color: var(--muted); padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--line-2); }

/* sanad */
.sanad-hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: clamp(20px, 4vw, 36px); border: 1px solid color-mix(in srgb, var(--accent-2) 35%, var(--line));
  background: radial-gradient(700px circle at 0% 100%, rgba(255, 120, 50, .28), transparent 60%), linear-gradient(160deg, #241812, #17110e 60%);
  color: #f5eee7; display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
}

<script type="text/plain" id="src-mudabbir">/// core/services/content_sync_service.dart
/// Offline-first: fetch fresh data when online, otherwise
/// return the cached copy instantly, with its real timestamp.
class ContentSyncService {
  final DioClient _dioClient;
  final HiveService _hiveService;

  ContentSyncService(this._dioClient, this._hiveService);

  Future<SyncedContent> getContent({
    required String cacheKey,
    required String remoteUrl,
    required bool isOnline,
    required String fallbackAsset,
  }) async {
    final cached = _hiveService.readContent(cacheKey);

    if (isOnline) {
      final remote = await _dioClient.fetchRaw(remoteUrl);
      if (remote != null && remote.trim().isNotEmpty) {
        final now = DateTime.now();
        await _hiveService.saveContent(cacheKey, remote);
        await _hiveService.setLastUpdated(cacheKey, now);
        return SyncedContent(rawJson: remote, lastUpdated: now, fromCache: false);
      }
    }

    if (cached != null) {
      final lastUpdated = _hiveService.getLastUpdated(cacheKey);
      return SyncedContent(rawJson: cached, lastUpdated: lastUpdated, fromCache: true);
    }

    // first launch ever: fall back to data bundled in the app
    return SyncedContent(rawJson: null, lastUpdated: null, fromCache: true, assetFallbackPath: fallbackAsset);
  }
}</script>

//  * Only one card per category is hidden and we know our hand, so the whole
//    world state is just (solution person, weapon, location).
//  * SHOWN eliminates exactly one candidate whatever we ask, so asking three
//    candidates at once and only replacing the one shown is optimal.
//  * The opponent's guesses leak information: a bot guessing among what it
//    still considers possible names the solution.
//  * A wrong accusation is still worth 3, losing the race is worth 0, so a
//    small DP over the race decides when to stop asking and accuse.
#include <bits/stdc++.h>
using namespace std;

static const int G = 4;
static const double GAM[G] = {0.0, 0.5, 0.9, 0.99};
static const double GAM_PRIOR[G] = {0.4, 0.2, 0.2, 0.2};
static const double SOFT_CAP = 0.95;  // never fully trust inferred beliefs

struct Engine {
    vector<int> unk[3];      // unknown cards = solution candidates
    vector<double> W[G][3];  // per gamma: factorized belief over the solution
    double logPi[G];

    void normalize() {
        for (int g = 0; g < G; g++)
            for (int c = 0; c < 3; c++) {
                double s = 0;
                for (double v : W[g][c]) s += v;
                // ...
            }
    }
};</script>

  /* ---------- syntax highlighter (per line, tiny) ---------- */
  const KW = new Set("const let var function return if else for while class extends implements new public private protected static final void int double bool boolean String import from export default interface type async await try catch throw this super struct vector auto true false null nullptr required late Future switch case break continue using namespace include override library package abstract enum readonly echo".split(" "));
  function hlLine(line, lang, isComment) {
    const t = line.trim();
    if (isComment || t.startsWith("*") || t.startsWith("///")) return `<span class="cm">${esc(line)}</span>`;
    if (lang === "tree") {
      return esc(line).replace(/(\/\/.*)$/, '<span class="cm">$1</span>').replace(/([├└│─]+)/g, '<span class="cm">$1</span>').replace(/\b(\w+Page|\w+Card|\w+Button)\b/g, '<span class="ty">$1</span>').replace(/(^|\s)([\w.-]+\/)/g, '$1<span class="k">$2</span>');
    }
    const yaml = lang === "yaml" || lang === "sh";
    const re = yaml
      ? /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][\w]*)(?=\s*[:=])|([A-Za-z_][\w+.-]*)/g

    let out = "", last = 0, m;
    while ((m = re.exec(line))) {
      out += esc(line.slice(last, m.index)); last = re.lastIndex;
      const [all, cm, str, num, fa, w] = m; const e = esc(all);
      if (cm) out += `<span class="cm">${e}</span>`;
      else if (str) out += `<span class="s">${e}</span>`;
      else if (num) out += `<span class="nm">${e}</span>`;

      else if (w) out += KW.has(w) ? `<span class="k">${e}</span>` : (!yaml && /^[A-Z][a-z]/.test(w)) ? `<span class="ty">${e}</span>` : e;
    }
    out += esc(line.slice(last));
    return out.replace(/(https?:\/\/[^"'&<\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
              .replace(/([\w.]+@[\w.]+\.com)/g, '<a href="mailto:$1">$1</a>');

    else if (e.key === "Enter") { e.preventDefault(); choose(palSel); }
    else if (e.key === "Escape") closePal();
  });
  palList.addEventListener("click", (e) => { const li = e.target.closest("li[data-i]"); if (!li) return; if (e.target.closest("a")) closePal(); else choose(+li.dataset.i); });
  palWrap.addEventListener("click", (e) => { if (e.target === palWrap) closePal(); });
  addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palWrap.hidden ? openPal() : closePal(); }
    else if (e.key === "Escape" && !palWrap.hidden) closePal();
    else if (e.ctrlKey && e.key === "`") { e.preventDefault(); toggleTerm(); }
  });
  $("#searchBtn").addEventListener("click", openPal);

  /* ---------- activity bar, mobile drawer, theme ---------- */
  $$(".act").forEach((b) => b.addEventListener("click", () => {
    const k = b.dataset.act;
    if (k === "search") openPal(); else if (k === "github") open("github"); else if (k === "contact") open("contact");
    else if (k === "terminal") toggleTerm(); else open(active === "welcome" ? "projects" : "welcome");
  }));
  $("#menuBtn").addEventListener("click", () => app.classList.toggle("side-open"));
  $("#scrim").addEventListener("click", () => app.classList.remove("side-open"));
  $("#stBranch").addEventListener("click", () => open("github"));
  $("#stSync").addEventListener("click", () => open("github"));
  function toggleTheme(force) {
    const root = document.documentElement;
    const next = force === "light" || force === "dark" ? force : (root.dataset.theme === "light" ? "dark" : "light");
    root.dataset.theme = next; try { localStorage.setItem("doaa-theme", next); } catch (e) {}
  }
  try { const t = localStorage.getItem("doaa-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("#themeBtn").addEventListener("click", () => toggleTheme());

  /* ---------- copy email ---------- */
  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1800); };
  function copyEmail() {
    const fb = () => { const el = $("#mail"); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("selected · press Ctrl+C"); };
    try { navigator.clipboard.writeText(LINKS.email).then(() => toast("✓ email copied"), fb); } catch (e) { fb(); }
  }

  /* ---------- GitHub sync ---------- */
  const SNAP_AT = "2026-11-06T13:15:00Z";
  const SNAP = {
    repos: [
      { name: "prompt-window-optimizer", description: "A lightweight Java engine optimizing LLM context window using Prefix Sum and Sliding Window to minimize token costs and latency.", language: "Java", stargazers_count: 0, pushed_at: "2026-10-10T10:02:45Z" },
      { name: "newproject", description: "Global Medal: smart awards & gifts assistant. React 19, TypeScript, Tailwind, bilingual RTL.", language: "TypeScript", stargazers_count: 0, pushed_at: "2026-09-08T07:59:38Z" },
      { name: "sanad-app", description: "Sanad: a digital bridge connecting Gaza's freelancers with clients.", language: null, stargazers_count: 0, pushed_at: "2026-08-14T21:35:06Z" },
      { name: "Git-and-GitHub-Handbook", description: "A bilingual practical guide to learning Git and GitHub.", language: null, stargazers_count: 2, pushed_at: "2026-08-11T18:21:18Z" },
      { name: "SmartOfflineWallet", description: "Offline-first Java wallet app with secure PIN, full transaction history, and automatic sync when online.", language: "Java", stargazers_count: 0, pushed_at: "2026-03-01T21:38:27Z" },
      { name: "DoaaAlyazgi-", description: "Profile README.", language: null, stargazers_count: 1, pushed_at: "2026-02-24T13:30:56Z" }
    ],
    langs: { TypeScript: 221335, Java: 21972, JavaScript: 4440, CSS: 3702, HTML: 1320 }
  };
  const LC = { TypeScript: "#3d8eff", Java: "#ff8a4c", JavaScript: "#f1e05a", CSS: "#b58cff", HTML: "#e34c26", Dart: "#2fc4d8", "C++": "#ff5c7a", Python: "#3572a5" };
  const gh = { repos: SNAP.repos, langs: SNAP.langs, live: false, at: SNAP_AT, loading: true };
  const fmt = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  function setSyncUI() {
    $("#stSyncText").textContent = gh.loading ? "GitHub: syncing…" : gh.live ? "GitHub: live" : "GitHub: cached " + fmt(gh.at);
    const ts = $("#treeSync"); if (ts) { ts.textContent = gh.loading ? "…" : gh.live ? "LIVE" : "CACHE"; ts.className = "badge " + (gh.live ? "live" : "new"); }
    $("#actDot").hidden = !gh.live;
    const s = $("#ghSync"); if (s) { s.className = "sync" + (gh.live ? " live" : ""); $("#ghSyncT").textContent = gh.loading ? "syncing…" : gh.live ? "live · synced just now" : "offline copy · last synced " + fmt(gh.at); }
  }
  function renderGH() {
    setSyncUI();
    const body = $("#ghBody"); if (!body) return;
    const repos = [...gh.repos].sort((x, y) => new Date(y.pushed_at) - new Date(x.pushed_at));
    const ent = Object.entries(gh.langs).sort((x, y) => y[1] - x[1]); const tot = ent.reduce((s, [, v]) => s + v, 0) || 1;
    body.innerHTML = `<div class="langbar">${ent.map(([k, v]) => `<span style="width:${(v / tot * 100).toFixed(2)}%;background:${LC[k] || "#8089a3"}"></span>`).join("")}</div>
      <ul class="langs">${ent.map(([k, v]) => `<li><i style="background:${LC[k] || "#8089a3"}"></i>${esc(k)} <b>${(v / tot * 100).toFixed(1)}%</b></li>`).join("")}</ul>
      <div class="repos">${repos.map((r, i) => `<a class="repo" style="--i:${i}" href="${LINKS.github}/${esc(r.name)}" target="_blank" rel="noopener"><b>${esc(r.name)}</b><span>${esc(r.description || "No description yet.")}</span><div class="rm">${r.language ? `<span><i style="background:${LC[r.language] || "#8089a3"}"></i>${esc(r.language)}</span>` : ""}<span>★ ${r.stargazers_count}</span><span>${fmt(r.pushed_at)}</span></div></a>`).join("")}</div>
      <details class="raw"><summary>{ } view raw response</summary><div class="panel" style="margin-top:8px">${codeHTML(JSON.stringify(repos.map((r) => ({ name: r.name, language: r.language, stars: r.stargazers_count, pushed_at: r.pushed_at })), null, 2), "ts")}</div></details>`;
  }
  (async () => {
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 5000);
    try {
      const get = (u) => fetch("https://api.github.com/" + u, { signal: ctl.signal, headers: { Accept: "application/vnd.github+json" } }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      const repos = (await get("users/DoaaAlyazgi/repos?per_page=100&sort=pushed")).filter((r) => !r.fork);
      const ll = await Promise.all(repos.map((r) => get(`repos/DoaaAlyazgi/${r.name}/languages`).catch(() => ({}))));
      const langs = {}; ll.forEach((l) => Object.entries(l).forEach(([k, v]) => langs[k] = (langs[k] || 0) + v));
      const sd = Object.fromEntries(SNAP.repos.map((r) => [r.name, r.description]));
      repos.forEach((r) => { if (!r.description) r.description = sd[r.name]; });
      Object.assign(gh, { repos, langs: Object.keys(langs).length ? langs : SNAP.langs, live: true, at: new Date().toISOString() });
    } catch (e) { gh.live = false; }
    finally { clearTimeout(to); gh.loading = false; setSyncUI(); if (active === "github") renderGH(); }
  })();

  /* ---------- boot ---------- */
  buildTree();
  if (innerWidth < 820) showTerm(false);
  const startId = location.hash.slice(1);
  open(F[startId] ? startId : "welcome", true);
  setSyncUI();
  print(`<span class="c-mut">Welcome to Doaa's portfolio terminal. Type</span> <span class="c-ok">help</span> <span class="c-mut">to see what you can do.</span>`);
  if (!app.classList.contains("term-off")) setTimeout(() => typeRun("whoami"), reduce ? 0 : 1300);
})();
</script>

</body>
</html>
